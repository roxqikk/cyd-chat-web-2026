services:
  - type: web
    name: cyd-chat-2026
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ROOM_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://roxqikk.github.io
